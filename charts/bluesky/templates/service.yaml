apiVersion: v1
kind: Service
metadata:
  name: bluesky
  labels:
    {{- include "bluesky.labels" . | nindent 4 }}
  annotations:
    {{- include "bluesky.provenance" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: bluesky
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
